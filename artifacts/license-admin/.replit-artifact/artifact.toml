kind = "web"
previewPath = "/license-admin/"
title = "HotSpot License Admin"
version = "1.0.0"
id = "artifacts/license-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/license-admin/" ]
localPort = 21137

[services.development]
run = "pnpm --filter @workspace/license-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/license-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/license-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21137"
BASE_PATH = "/license-admin/"
